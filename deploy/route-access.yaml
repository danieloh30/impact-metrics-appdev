apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: impact-hours-route-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: impact-hours
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8443
