name: Dependabot auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Do not check out PR code or download its artifacts in this privileged workflow.
      - name: Enable auto-merge for the tested Dependabot head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          if ! jq -e '.name == "CI" and .conclusion == "success" and .event == "pull_request"' <<< "$run_json" > /dev/null; then
            exit 0
          fi
          tested_sha=$(jq -r '.head_sha' <<< "$run_json")
          while read -r pr_number; do
            [[ "$pr_number" =~ ^[0-9]+$ ]] || continue
            pr_json=$(gh api "repos/$GH_REPO/pulls/$pr_number")
            if jq -e --arg repo "$GH_REPO" --arg sha "$tested_sha" '
              .user.login == "dependabot[bot]" and .state == "open" and .draft == false
              and .head.repo.full_name == $repo and .base.repo.full_name == $repo
              and .base.ref == "main" and .head.sha == $sha' <<< "$pr_json" > /dev/null; then
              gh pr merge "$pr_number" --repo "$GH_REPO" --auto --squash --match-head-commit "$tested_sha"
            fi
          done < <(jq -r '.pull_requests[].number' <<< "$run_json")
