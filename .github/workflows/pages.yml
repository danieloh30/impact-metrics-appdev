name: Operations guide
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check-docs.mjs', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/site/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check-docs.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build isolated documentation site
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r requirements-docs.txt
          .venv-docs/bin/python -m mkdocs build --strict
          node scripts/check-docs.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - name: Verify documentation in a browser
        run: |
          npm ci --prefix src/main/webui
          cd src/main/webui
          npx playwright install --with-deps chromium
          cd ../../..
          node scripts/verify-docs-ui.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish operations guide
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
