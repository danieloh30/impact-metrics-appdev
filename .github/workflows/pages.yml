name: Operations guide
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check-docs.mjs', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/site/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check-docs.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build isolated documentation site
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r requirements-docs.txt
          .venv-docs/bin/python -m mkdocs build --strict
          node scripts/check-docs.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - name: Verify documentation in a browser
        run: |
          npm ci --prefix src/main/webui
          cd src/main/webui
          npx playwright install --with-deps chromium
          cd ../../..
          node scripts/verify-docs-ui.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish operations guide
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
