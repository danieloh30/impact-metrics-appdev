name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - name: Install frontend dependencies for browser transport tests
        working-directory: src/main/webui
        run: npm ci
      - name: Install Chrome for Java SharePoint transport tests
        working-directory: src/main/webui
        run: npx playwright install --with-deps chrome
      - name: Auto-merge guard regression tests
        run: node .github/scripts/test-automerge.mjs
      - name: Install virtual desktop for minimized Chrome tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox x11-utils
      - name: Backend tests and package
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bash -euo pipefail <<'VIRTUAL_DESKTOP'
          openbox --sm-disable > /tmp/impact-metrics-window-manager.log 2>&1 &
          window_manager_pid=$!
          trap 'kill "$window_manager_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'; then break; fi
            sleep 1
          done
          if ! xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'; then
            cat /tmp/impact-metrics-window-manager.log
            echo 'Virtual desktop window manager did not become ready.' >&2
            exit 1
          fi
          ./mvnw -B verify -DskipITs
          VIRTUAL_DESKTOP
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/main/webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Mocked browser regression suite
        env:
          METRICS_URL: http://127.0.0.1:4173
          METRICS_RESET_TESTS: 'false'
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$METRICS_URL/" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: target/playwright/
          if-no-files-found: ignore
          retention-days: 7
