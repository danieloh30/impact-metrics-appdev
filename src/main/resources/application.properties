quarkus.http.host=127.0.0.1
quarkus.http.port=8097
quarkus.http.limits.max-body-size=12M
quarkus.http.limits.max-form-attribute-size=12M
quarkus.http.body.uploads-directory=runtimes/.uploads
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server=false
quarkus.quinoa.package-manager-install=false
quarkus.langchain4j.openai.api-key=${METRICS_MODEL_API_KEY:unused}
quarkus.langchain4j.openai.base-url=${METRICS_MODEL_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.chat-model.model-name=${METRICS_MODEL_NAME:gpt-4o-mini}
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.chat-model.log-requests=false
quarkus.langchain4j.openai.chat-model.log-responses=false
metrics.runtime-root=runtimes
metrics.instructions.sha256=d021210e554a0af8141d44797052a0b9e2bb47fba46935f47a8d2c08af8e43ef
metrics.ai.enabled=${METRICS_AI_ENABLED:false}
metrics.collection.enabled=true
metrics.linkedin.enabled=${METRICS_LINKEDIN_ENABLED:true}
%test.metrics.runtime-root=target/test-runtimes
%test.metrics.collection.enabled=false
%test.metrics.ai.enabled=false
%test.quarkus.quinoa=false

metrics.sharepoint.enabled=${METRICS_SHAREPOINT_ENABLED:true}
metrics.sharepoint.host=ibm-my.sharepoint.com
metrics.sharepoint.browser-channel=${METRICS_SHAREPOINT_BROWSER_CHANNEL:chrome}
metrics.sharepoint.browser-executable=${METRICS_SHAREPOINT_BROWSER_EXECUTABLE:}
%test.metrics.sharepoint.enabled=false
