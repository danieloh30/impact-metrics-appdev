# One stateful workspace behind an OpenShift OAuth proxy and HTTPS Route.
quarkus.application.name=impact-hours
quarkus.http.host=0.0.0.0
quarkus.http.port=8097
quarkus.http.body.uploads-directory=/data/metrics/.uploads
metrics.runtime-root=/data/metrics/runtimes
metrics.sharepoint.browser-executable=/usr/local/bin/metrics-chromium
metrics.linkedin.browser-executable=/usr/local/bin/metrics-chromium
metrics.browser-login-mode=LOCAL_HELPER
metrics.dzone.browser-executable=/usr/local/bin/metrics-chromium
metrics.dzone.headless=true
metrics.dzone.minimized=false
# Model reviewers are enabled for deployed workspaces; credentials stay in a Secret.
metrics.ai.enabled=${METRICS_AI_ENABLED:true}

quarkus.container-image.name=impact-hours
quarkus.container-image.registry=image-registry.openshift-image-registry.svc:5000
quarkus.container-image.tag=${METRICS_IMAGE_TAG:latest}
quarkus.openshift.build-strategy=docker
quarkus.openshift.jvm-dockerfile=src/main/docker/Dockerfile.openshift
quarkus.kubernetes.deployment-target=openshift,kubernetes
quarkus.openshift.name=impact-hours
quarkus.openshift.deployment-kind=StatefulSet
quarkus.openshift.replicas=1
quarkus.openshift.add-version-to-label-selectors=false
# The script enables and secures the Route before applying resources. A plain
# Maven deploy must not generate an unprotected public application Route.
quarkus.openshift.route.expose=false
quarkus.openshift.route.tls.termination=reencrypt
quarkus.openshift.route.tls.insecure-edge-termination-policy=Redirect
quarkus.openshift.image-pull-policy=Always
quarkus.openshift.ports.http.container-port=8097
quarkus.openshift.env.vars.QUARKUS_PROFILE=openshift
quarkus.openshift.env.vars.METRICS_RUNTIME_ROOT=/data/metrics/runtimes
quarkus.openshift.env.mapping.METRICS_MODEL_API_KEY.from-secret=impact-hours-model
quarkus.openshift.env.mapping.METRICS_MODEL_API_KEY.with-key=METRICS_MODEL_API_KEY
quarkus.openshift.pvc-volumes.runtime.claim-name=impact-hours-data
quarkus.openshift.mounts.runtime.path=/data/metrics
quarkus.openshift.empty-dir-volumes=tmp,shared-memory
quarkus.openshift.mounts.tmp.path=/tmp
quarkus.openshift.mounts.shared-memory.path=/dev/shm
quarkus.openshift.security-context.run-as-non-root=true
quarkus.openshift.security-context.allow-privilege-escalation=false
quarkus.openshift.security-context.read-only-root-filesystem=true
quarkus.openshift.resources.requests.cpu=500m
quarkus.openshift.resources.requests.memory=1Gi
quarkus.openshift.resources.limits.cpu=2
quarkus.openshift.resources.limits.memory=3Gi
quarkus.openshift.readiness-probe.http-action-path=/api/runs
quarkus.openshift.liveness-probe.http-action-path=/api/config
quarkus.openshift.startup-probe.http-action-path=/api/runs
quarkus.openshift.startup-probe.period=5s
quarkus.openshift.startup-probe.failure-threshold=60

# Portable manifests use the same runtime and storage layout, without OpenShift build resources.
quarkus.kubernetes.name=impact-hours
quarkus.kubernetes.deployment-kind=StatefulSet
quarkus.kubernetes.replicas=1
quarkus.kubernetes.add-version-to-label-selectors=false
quarkus.kubernetes.image-pull-policy=Always
quarkus.kubernetes.ports.http.container-port=8097
quarkus.kubernetes.env.vars.QUARKUS_PROFILE=openshift
quarkus.kubernetes.env.vars.METRICS_RUNTIME_ROOT=/data/metrics/runtimes
quarkus.kubernetes.env.mapping.METRICS_MODEL_API_KEY.from-secret=impact-hours-model
quarkus.kubernetes.env.mapping.METRICS_MODEL_API_KEY.with-key=METRICS_MODEL_API_KEY
quarkus.kubernetes.pvc-volumes.runtime.claim-name=impact-hours-data
quarkus.kubernetes.mounts.runtime.path=/data/metrics
quarkus.kubernetes.empty-dir-volumes=tmp,shared-memory
quarkus.kubernetes.mounts.tmp.path=/tmp
quarkus.kubernetes.mounts.shared-memory.path=/dev/shm
quarkus.kubernetes.security-context.run-as-non-root=true
quarkus.kubernetes.security-context.allow-privilege-escalation=false
quarkus.kubernetes.security-context.read-only-root-filesystem=true
quarkus.kubernetes.resources.requests.cpu=500m
quarkus.kubernetes.resources.requests.memory=1Gi
quarkus.kubernetes.resources.limits.cpu=2
quarkus.kubernetes.resources.limits.memory=3Gi
quarkus.kubernetes.readiness-probe.http-action-path=/api/runs
quarkus.kubernetes.liveness-probe.http-action-path=/api/config
quarkus.kubernetes.startup-probe.http-action-path=/api/runs
quarkus.kubernetes.startup-probe.period=5s
quarkus.kubernetes.startup-probe.failure-threshold=60
